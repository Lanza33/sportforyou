<style>
:root{
  --green:#003723;--green2:#0b4a32;--night:#00241a;--lime:#c8f03c;--ink:#10230f;
  --mint:#f2f6f3;--line:rgba(0,55,35,.12);--sale:#d93a26;--text:#14231c;--muted:#5d6b64;
  --r:14px;--rs:10px;--shadow:0 10px 30px rgba(0,36,23,.12);--max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font:16px/1.55 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Barlow,sans-serif;font-weight:800;line-height:1.08;letter-spacing:-.01em;margin:0 0 .5em}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
@media(min-width:750px){.wrap{padding:0 32px}}
.kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.dark .kicker{color:var(--lime);opacity:1}
.dark{background:var(--green);color:#fff}
.night{background:var(--night);color:#fff}
.mint{background:var(--mint)}
.limebg{background:var(--lime);color:var(--ink)}
em{font-style:normal;color:var(--lime)}
.limebg em,.mint em{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;background:var(--green);color:#fff;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn--lime{background:var(--lime);color:var(--ink)}
.btn--lime:hover{background:#d7f766}
.btn--ghost{background:transparent;border-color:currentColor;color:inherit}
.btn--wa{background:#fff;color:#128c4a;border-color:#128c4a}
.btn--block{width:100%}
.sec{padding:56px 0}
@media(min-width:990px){.sec{padding:80px 0}}
.sec__head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.sec__head h2{margin:0;font-size:clamp(28px,4vw,40px)}
.sec__head a{font-weight:700;color:var(--green)}
.demo-flag{position:fixed;left:12px;bottom:12px;z-index:200;background:#ffeb3b;color:#000;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;box-shadow:var(--shadow);pointer-events:none}

/* announcement */
.ann{background:var(--night);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;gap:28px;height:38px;padding:0 16px}
.ann a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.ann a:hover{color:var(--lime)}
.ann svg{width:15px;height:15px;color:var(--lime)}
/* header */
.hdr{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hdr__in{display:flex;align-items:center;gap:20px;height:86px;transition:height .2s}
.hdr.small .hdr__in{height:66px}
.logo{font-family:Barlow;font-weight:800;font-size:26px;color:var(--green);text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
.logo b{color:var(--ink);background:var(--lime);padding:0 6px;border-radius:6px;margin-left:2px}
.nav{display:none;gap:4px;flex:1}
@media(min-width:990px){.nav{display:flex;justify-content:center;align-self:stretch}.nav>div{display:flex}}
.nav>div{position:static}
.nav>div>a{display:flex;align-items:center;height:100%;padding:0 10px;font-weight:600;text-decoration:none;font-size:15px}
.nav>div>a:hover{color:var(--green);text-decoration:underline;text-underline-offset:6px}
.nav a.sale{color:var(--sale);font-weight:700}
.mega{position:absolute;left:0;right:0;top:calc(100% - 1px);background:#fff;border-top:1px solid var(--line);box-shadow:var(--shadow);display:none}
.nav>div:hover .mega,.nav>div:focus-within .mega{display:block}
.mega__in{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:24px;padding:32px 0}
.mega__in a{display:flex;align-items:center;gap:12px;text-decoration:none;padding:6px 0;font-weight:500}
.mega__in a:hover{color:var(--green)}
.mega__img{width:44px;height:44px;border-radius:var(--rs);background:var(--mint);display:inline-flex;align-items:center;justify-content:center;flex:none}
.mega__img svg{width:28px;height:28px;color:var(--green)}
.mega__promo{background:var(--green) center/cover no-repeat;color:#fff;border-radius:var(--r);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;min-height:220px;transition:transform .3s}
.mega__promo:hover{transform:translateY(-2px)}
.mega__promo h4{font-size:22px}
.hdr__tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{position:relative;width:44px;height:44px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);text-decoration:none}
.icon-btn:hover{background:var(--mint)}
.icon-btn svg{width:22px;height:22px}
.count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.count:empty,.count[data-n="0"]{display:none}
.lang{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-size:13px;font-weight:700}
.burger{display:inline-flex}
@media(min-width:990px){.burger{display:none}.lang{display:inline-block}}
@media(max-width:989px){.lang{display:none}}
.search{display:none;border-top:1px solid var(--line);padding:12px 0}
.search.open{display:block}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:999px;padding:0 20px}

/* mobile drawer */
.mnav{position:fixed;inset:0;z-index:120;display:none}
.mnav.open{display:block}
.mnav__bg{position:absolute;inset:0;background:rgba(0,20,12,.5)}
.mnav__panel{position:absolute;top:0;bottom:0;left:0;width:min(88vw,380px);background:#fff;overflow:auto;padding:20px}
.mnav details{border-bottom:1px solid var(--line)}
.mnav summary{padding:14px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.mnav summary::after{content:"+"}
.mnav details[open] summary::after{content:"–"}
.mnav details a{display:block;padding:8px 12px;text-decoration:none}

/* hero */
.hero{position:relative;display:grid;overflow:hidden}
.slide{grid-area:1/1;min-height:clamp(440px,72vh,700px);display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;position:relative}
.slide.on{opacity:1;visibility:visible}
.slide .court{position:absolute;inset:0;width:100%;height:100%;opacity:.14;color:#fff}
.slide__c{position:relative;max-width:640px}
.slide h1{font-size:clamp(38px,6.4vw,72px)}
.slide p{font-size:18px;opacity:.88;max-width:520px}
.slide .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.slide__art{position:absolute;right:4%;bottom:0;top:0;width:42%;display:none;align-items:center;justify-content:center}
@media(min-width:990px){.slide__art{display:flex}}
.slide__art svg{width:78%;color:var(--lime);filter:drop-shadow(0 20px 40px rgba(0,0,0,.3))}
.dots{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:5px;border:0;background:rgba(255,255,255,.4);cursor:pointer;padding:0;transition:width .3s}
.dots button.on{width:28px;background:var(--lime)}

/* trust */
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding-top:24px;padding-bottom:24px}
@media(min-width:990px){.trust{grid-template-columns:repeat(4,1fr)}.trust div{justify-content:center}}
.trust div{display:flex;gap:12px;align-items:center}
.trust svg{width:34px;height:34px;color:var(--green);flex:none}
.trust strong{display:block;font-size:15px}
.trust small{color:var(--muted)}

/* sport tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:750px){.tiles{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1200px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--green);color:#fff;text-decoration:none;display:flex;align-items:flex-end;padding:16px}
.tile svg.art{position:absolute;top:14%;left:50%;transform:translateX(-50%);width:62%;color:var(--lime);transition:transform .4s}
.tile:hover svg.art{transform:translateX(-50%) scale(1.08) rotate(-6deg)}
.tile:nth-child(even){background:var(--green2)}
.tile h3{margin:0;font-size:22px;position:relative}
.tile span{position:absolute;right:14px;bottom:16px;width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800}

/* product grid & card */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:750px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:990px){.grid--4{grid-template-columns:repeat(4,1fr)}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc(50% - 6px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
@media(min-width:750px){.rail{grid-auto-columns:calc(33.33% - 14px);gap:20px}}
@media(min-width:990px){.rail{grid-auto-columns:calc(25% - 15px)}}
.rail>*{scroll-snap-align:start}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card__media{position:relative;aspect-ratio:1;background:var(--mint);display:flex;align-items:center;justify-content:center;text-decoration:none}
.card__media svg{width:56%;color:var(--green);transition:transform .3s}
.card:hover .card__media svg{transform:scale(1.06)}
.badges{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.badge{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--green);color:#fff}
.badge--sale{background:var(--sale)}
.badge--new{background:var(--lime);color:var(--ink)}
.badge--low{background:#fff;color:var(--sale);border:1px solid var(--sale)}
.wish{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--green)}
.wish svg{width:20px;height:20px}
.wish.on svg{fill:var(--sale);color:var(--sale)}
.card__body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.vendor{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card__title{font-weight:600;text-decoration:none;line-height:1.35}
.card__title:hover{text-decoration:underline}
.price{font-weight:800;font-family:Barlow;font-size:19px;margin-top:auto;padding-top:6px}
.price s{font-weight:500;color:var(--muted);font-size:15px;margin-left:6px}
.price.sale{color:var(--sale)}
.card .btn{min-height:42px;margin-top:10px;font-size:14px}
.onreq{color:var(--green);font-size:15px}

/* advisor */
.adv{display:grid;gap:32px;align-items:center}
@media(min-width:990px){.adv{grid-template-columns:1fr 1.2fr}}
.quiz{background:#fff;color:var(--text);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.quiz__steps{display:flex;gap:6px;margin-bottom:16px}
.quiz__steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.quiz__steps i.on{background:var(--green)}
.quiz h4{font-size:22px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts button{min-height:52px;border-radius:var(--rs);border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.opts button:hover,.opts button.on{border-color:var(--green);background:var(--mint)}
.sf__opts{grid-template-columns:repeat(3,1fr);margin:8px 0 14px}
.sf__opts button{min-height:46px;font-size:15px}
@media(max-width:600px){.sf__opts{grid-template-columns:repeat(2,1fr)}}
.sf__res{display:grid;gap:10px}
.sf__it{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--rs);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.sf__it:hover{border-color:var(--green);transform:translateY(-1px)}
.sf__img{width:72px;height:72px;display:block;background:#fff}
.sf__img img{width:100%;height:100%;object-fit:contain}
.sf__it strong{display:block;font-size:16px;margin:1px 0 5px}
.sf__rk{color:var(--green);font-weight:700;font-size:12px}
.sf__p{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.sf__p b{display:block;font-size:17px;color:var(--text)}
@media(max-width:480px){.sf__it{grid-template-columns:56px 1fr}.sf__img{width:56px;height:56px}.sf__p{grid-column:2;text-align:left}.sf__p b{display:inline}}

/* b2b */
.b2b{display:grid;gap:32px;align-items:center}
@media(min-width:990px){.b2b{grid-template-columns:1.1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.chip{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);text-decoration:none;font-weight:600;font-size:14px}
.chip:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.mint .chip,.chipbar .chip{border-color:var(--line);background:#fff}
.chipbar .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.courts.sec{padding:40px 0 0}
.courts__head{max-width:860px;text-align:center;margin-bottom:40px}
.courts__head h2{margin-top:0}
.courts__head p{opacity:.85;font-size:17px;margin-bottom:0}
.courts__row{display:grid;grid-template-columns:repeat(3,1fr)}
.courts__it{position:relative;display:block;aspect-ratio:4/5;max-height:620px;width:100%;overflow:hidden;color:#fff;text-decoration:none}
.courts__it img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.courts__it:hover img{transform:scale(1.05)}
.courts__it::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,30,20,.92),rgba(4,30,20,.15) 55%,transparent)}
.courts__it div{position:absolute;left:0;right:0;bottom:0;padding:28px;z-index:1}
.courts__it h3{font-size:clamp(24px,2.4vw,34px);margin:0 0 6px}
.courts__it p{margin:0 0 16px;opacity:.9}
@media(max-width:749px){.courts__row{grid-template-columns:1fr}.courts__it{aspect-ratio:4/3}}
.b2b__art{border-radius:var(--r);background:var(--green2);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.b2b__art svg{width:84%;color:var(--lime)}

/* brands */
.brands{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.brands__track{display:flex;gap:48px;width:max-content;animation:scroll 40s linear infinite}
.brands:hover .brands__track{animation-play-state:paused}
.brands__track span{font-family:Barlow;font-weight:800;font-size:26px;color:var(--green);opacity:.55;white-space:nowrap}
.brands__track span:hover{opacity:1}
@keyframes scroll{to{transform:translateX(-50%)}}

/* instagram */
.insta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:990px){.insta{grid-template-columns:repeat(6,1fr)}}
.insta a{aspect-ratio:1;border-radius:var(--rs);background:var(--green);display:flex;align-items:center;justify-content:center}
.insta a:nth-child(odd){background:var(--green2)}
.insta svg{width:40%;color:var(--lime);opacity:.8}

/* newsletter */
.nl{display:grid;gap:24px;align-items:center}
@media(min-width:990px){.nl{grid-template-columns:auto 1fr 1fr}}
.nl__big{font-family:Barlow;font-weight:800;font-size:clamp(64px,10vw,120px);color:var(--lime);line-height:1}
.nl form{display:flex;flex-wrap:wrap;gap:10px}
.nl input[type=email]{flex:1 1 220px;height:52px;border-radius:999px;border:0;padding:0 20px}
.nl label{font-size:13px;opacity:.85;flex-basis:100%;display:flex;gap:8px}

/* location */
.loc{display:grid;gap:24px}
@media(min-width:990px){.loc{grid-template-columns:1fr 1.3fr;align-items:center}}
.rev{display:flex;flex-direction:column;gap:16px}
.rev__head{display:flex;gap:14px;align-items:center}
.rev__head>svg{width:44px;height:44px;flex:none}
.rev__head h2{font-size:clamp(24px,3vw,34px);margin:0}
.rev__head p{margin:4px 0 0;font-size:15px}
.rev__head .kicker{margin-bottom:2px}
.rev__sl{display:grid}
.rev__sl>.rev__c{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.rev__sl>.rev__c.on{opacity:1;visibility:visible}
.rev__nav{grid-area:2/1;display:flex;align-items:center;gap:10px;margin-top:10px}
.rev__nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;cursor:pointer}
.rev__nav button:hover{border-color:var(--green)}
.rev__nav span{display:flex;gap:5px}
.rev__nav i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .3s}
.rev__nav i.on{width:20px;border-radius:4px;background:var(--green)}
.rev__btns{display:flex;gap:8px;flex-wrap:wrap}
.rev__btns .btn{min-height:42px;font-size:14px;padding:0 18px}
.rev__c{margin:0;background:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rev__ph.on{opacity:.65}
.rev__ph{border:1.5px dashed var(--line);box-shadow:none}
.rev__top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.rev__top>div{flex:1;line-height:1.2}
.rev__top strong{display:block;font-size:14px}
.rev__top small{color:var(--muted);font-size:12px}
.rev__av{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.rev__st{color:#fbbc05;letter-spacing:1px;font-size:15px}
.rev__c blockquote{margin:8px 0 0;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.map{border-radius:var(--r);background:#dfe8e2;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;position:relative;overflow:hidden}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%;color:var(--green);opacity:.12}
.map>*:not(.bg){position:relative}
